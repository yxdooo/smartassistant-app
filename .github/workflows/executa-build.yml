name: Executa build

# Builds the SmartAssistant Executa as a single binary per platform and
# attaches the archives to a GitHub release. Cloud Agent runs on Linux, so
# linux-x86_64 is required. Tag with executa-v<version> to publish assets.

on:
  push:
    tags: ["executa-v*"]
    paths: ["anna/**", ".github/workflows/executa-build.yml"]
  pull_request:
    paths: ["anna/**", ".github/workflows/executa-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOL_ID: tool-dev-smartassistant
  EXECUTA_DIR: anna/executas/smartassistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        working-directory: anna
        run: |
          python -m unittest discover -s tests -v
          python tests/protocol_check.py
      - name: JS parity tests
        working-directory: anna
        run: node --test tests/parity.test.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, python_arch: "" }
          - { os: macos-14, name: darwin-arm64, python_arch: "" }
          # Intel macOS builds on an Apple Silicon runner with an x64 Python.
          - { os: macos-14, name: darwin-x86_64, python_arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch || '' }}
      - name: Build binary
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --clean --noupx --name "$TOOL_ID" smartassistant_plugin.py
          test -f "dist/$TOOL_ID"
      - name: Smoke test
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          out="$(printf '%s\n' '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/$TOOL_ID")"
          echo "$out"
          printf '%s' "$out" | python3 -c "import sys,json,os; d=json.load(sys.stdin)['result']; assert d['name']==os.environ['TOOL_ID']; assert [t['name'] for t in d['tools']]==['ping','plan_targets','weekly_review']; assert all(isinstance(t['parameters'], list) for t in d['tools'])"
          review='{"jsonrpc":"2.0","method":"invoke","id":2,"params":{"tool":"plan_targets","arguments":{"weight_kg":70,"height_cm":170,"age":30,"monthly_budget":1500,"today":"2026-03-10"}}}'
          printf '%s\n' "$review" | "./dist/$TOOL_ID" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; assert r['success'] and r['data']['calories']>0"
      - name: Package
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          asset="$TOOL_ID-${{ matrix.name }}.tar.gz"
          mkdir -p package/bin
          cp "dist/$TOOL_ID" "package/bin/$TOOL_ID"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path('executa.json').read_text(encoding='utf-8'))
          entrypoint = 'bin/' + os.environ['TOOL_ID']
          manifest = {
              'name': os.environ['TOOL_ID'],
              'display_name': config['name'],
              'version': config['version'],
              'description': config['description'],
              'runtime': {'binary': {
                  'entrypoint': {'default': entrypoint},
                  'permissions': {entrypoint: '0o755'},
              }},
          }
          Path('package/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          tar -C package -czf "dist/$asset" .
          shasum -a 256 "dist/$asset" > "dist/$asset.sha256"
      - name: Test packaged archive
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          asset="dist/$TOOL_ID-${{ matrix.name }}.tar.gz"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$asset" -C "$stage"
          python3 - "$stage" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          entrypoint = root / manifest['runtime']['binary']['entrypoint']['default']
          assert manifest['version'] == '0.1.6'
          assert entrypoint.is_file() and os.access(entrypoint, os.X_OK)
          PY
          printf '%s\n' '{"jsonrpc":"2.0","method":"describe","id":"archive-test"}' | "$stage/bin/$TOOL_ID" | python3 -c "import sys,json; r=json.load(sys.stdin); assert r['id']=='archive-test' and r['result']['version']=='0.1.6'"
          python3 ../../tests/protocol_check.py "$stage/bin/$TOOL_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_ID }}-${{ matrix.name }}
          path: |
            ${{ env.EXECUTA_DIR }}/dist/*.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/executa-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SmartAssistant Executa ${{ github.ref_name }}
          body: Executa binaries for tool-dev-smartassistant (linux-x86_64, darwin-arm64, darwin-x86_64).
          files: assets/*
